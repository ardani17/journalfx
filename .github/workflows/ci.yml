name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mdtp
          POSTGRES_PASSWORD: mdtp
          POSTGRES_DB: ${{ inputs.release && 'horizon_journal_google_test' || 'mdtp_test' }}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mdtp"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://mdtp:mdtp@localhost:5432/${{ inputs.release && 'horizon_journal_google_test' || 'mdtp_test' }}
      AUTH_SECRET: ci-only-secret-not-for-production
      RUN_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - name: Run Playwright release checks
        if: inputs.release
        env:
          APP_ORIGIN: http://localhost:3210
        run: |
          npm run db:seed:demo
          npx playwright install --with-deps chromium
          npm run e2e
