map $uri $log_request {
  default 1;
  /api/auth/google/callback 0;
}

server {
  listen 80;
  server_name _;
  access_log /var/log/nginx/access.log combined if=$log_request;

  # reasonable limits for a personal app
  client_max_body_size 8m;

  location / {
    proxy_pass http://app:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 60s;

    location = /api/analytics/journal-insights {
      proxy_pass http://app:3000;
      proxy_read_timeout 310s;
    }
  }

  # health endpoint for external monitors
  location = /api/health {
    proxy_pass http://app:3000/api/health;
    access_log off;
  }
}
