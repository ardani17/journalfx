# MDTP production stack: app + postgres + nginx (TLS terminated by host/aaPanel or mount certs)
# Usage: docker compose -f docker-compose.prod.yml up -d
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mdtp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-mdtp}
    volumes:
      - mdtp_pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mdtp}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [mdtp]

  app:
    build: .
    image: mdtp-app:${APP_VERSION:-0.6.0}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-mdtp}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mdtp}?schema=public
      UPLOAD_DIR: /app/uploads
    volumes:
      - mdtp_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks: [mdtp]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]
    networks: [mdtp]

networks:
  mdtp:

volumes:
  mdtp_pgdata_prod:
  mdtp_uploads:
